<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 280px;
      margin: 0;
      padding: 14px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0B0F19;
      color: #F3F4F6;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #1F2937;
      padding-bottom: 10px;
      margin-bottom: 12px;
    }
    .title {
      font-size: 14px;
      font-weight: 700;
      color: #3B82F6;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .badge {
      font-size: 10px;
      padding: 2px 8px;
      border-radius: 12px;
      font-weight: 600;
      background: #10B981;
      color: #064E3B;
    }
    .status-card {
      background: #111827;
      border: 1px solid #374151;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 12px;
    }
    .label {
      font-size: 11px;
      color: #9CA3AF;
      margin-bottom: 4px;
    }
    .value {
      font-size: 12px;
      font-weight: 600;
      color: #E5E7EB;
    }
    .btn {
      width: 100%;
      padding: 8px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      margin-bottom: 6px;
      transition: background 0.2s;
    }
    .btn-primary {
      background: #3B82F6;
      color: #FFFFFF;
    }
    .btn-primary:hover {
      background: #2563EB;
    }
    .btn-danger {
      background: #EF4444;
      color: #FFFFFF;
    }
    .input-group {
      margin-top: 10px;
    }
    input {
      width: calc(100% - 16px);
      padding: 6px 8px;
      background: #1F2937;
      border: 1px solid #374151;
      border-radius: 4px;
      color: white;
      font-size: 11px;
      margin-bottom: 6px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">⚡ OmniPulse Agent</div>
    <div id="statusBadge" class="badge">ONLINE</div>
  </div>

  <div class="status-card">
    <div class="label">Current Shift State:</div>
    <div id="shiftStateText" class="value">🟢 Clocked In (Active)</div>
  </div>

  <button id="toggleShiftBtn" class="btn btn-danger">Pause / Take Break</button>

  <div class="input-group">
    <div class="label">Agent ID:</div>
    <input type="text" id="agentIdInput" value="agent-1">
    <div class="label">Backend Endpoint:</div>
    <input type="text" id="apiUrlInput" value="http://localhost:5000/api/v1/heartbeat">
    <button id="saveSettingsBtn" class="btn btn-primary">Save Settings</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
